name: Windows

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: >-
          ./scripts/prepare-release-notes.ps1
          -Tag "${{ github.ref_name }}"
          -ProjectFile CMakeLists.txt
          -ChangeLog CHANGELOG.md
          -OutputFile "$env:RUNNER_TEMP/release-notes.md"

      - name: Validate JSON Schema documents
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = 'Stop'
          python -m pip install check-jsonschema==0.37.4
          check-jsonschema --check-metaschema schemas/*.schema.json
          check-jsonschema --schemafile schemas/lab.schema.json config/lab.template.json
          check-jsonschema --schemafile schemas/agent.schema.json examples/agent-vm-01.json
          check-jsonschema --schemafile schemas/agent.schema.json config/agent.template.json
          check-jsonschema --schemafile schemas/task.schema.json examples/hello-vm-task.json
          check-jsonschema --schemafile schemas/task.schema.json examples/multi-vm-task.json

      - name: Configure
        run: >-
          cmake --preset windows-default
          -DSATSUMA_BUILD_NUMBER=${{ github.run_number }}
          -DSATSUMA_BUILD_ATTEMPT=${{ github.run_attempt }}
          -DSATSUMA_GIT_COMMIT=${{ github.sha }}

      - name: Build Debug
        run: cmake --build --preset windows-debug --parallel

      - name: Test Debug
        run: ctest --preset windows-debug --repeat until-fail:3

      - name: Retain Debug test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-debug
          path: build/windows-default/Testing/Temporary/
          if-no-files-found: ignore

      - name: Build Release
        run: cmake --build --preset windows-release --parallel

      - name: Test Release
        run: ctest --preset windows-release --repeat until-fail:3

      - name: Retain Release test logs and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-release-and-evidence
          include-hidden-files: true
          path: |
            build/windows-default/Testing/Temporary/
            ${{ runner.temp }}/vm-agent-claim-test*/
          if-no-files-found: ignore

      - name: Package Release
        run: cmake --build --preset windows-release --target SatsumaPackage

      - uses: actions/upload-artifact@v7
        with:
          name: SatsumaTestLab-windows-x64
          path: |
            output/*.zip
            output/*.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-test-package
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: SatsumaTestLab-windows-x64
          path: release-assets

      - name: Prepare release notes
        shell: pwsh
        run: >-
          ./scripts/prepare-release-notes.ps1
          -Tag "${{ github.ref_name }}"
          -ProjectFile CMakeLists.txt
          -ChangeLog CHANGELOG.md
          -OutputFile "$env:RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release-assets -File |
              Sort-Object Name |
              Select-Object -ExpandProperty FullName
          if ($assets.Count -eq 0) {
              throw "No release assets were downloaded"
          }
          & gh release create "${{ github.ref_name }}" @assets `
              --verify-tag `
              --title "Satsuma TestLab ${{ github.ref_name }}" `
              --notes-file "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }
