name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON Schema documents
        shell: pwsh
        run: |
          python -m pip install check-jsonschema==0.37.4
          check-jsonschema --check-metaschema schemas/*.schema.json
          check-jsonschema --schemafile schemas/lab.schema.json lab.json
          check-jsonschema --schemafile schemas/lab.schema.json config/lab.template.json
          check-jsonschema --schemafile schemas/agent.schema.json examples/agent-vm-01.json
          check-jsonschema --schemafile schemas/agent.schema.json config/agent.template.json
          check-jsonschema --schemafile schemas/task.schema.json examples/hello-vm-task.json
          check-jsonschema --schemafile schemas/task.schema.json examples/multi-vm-task.json

      - name: Configure
        run: cmake --preset windows-default

      - name: Build Debug
        run: cmake --build --preset windows-debug --parallel

      - name: Test Debug
        run: ctest --preset windows-debug

      - name: Build Release
        run: cmake --build --preset windows-release --parallel

      - name: Test Release
        run: ctest --preset windows-release

      - name: Package Release
        run: cmake --build --preset windows-release --target SatsumaPackage

      - uses: actions/upload-artifact@v4
        with:
          name: SatsumaTestLab-windows-x64
          path: output/*.zip
          if-no-files-found: error
